<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Punch</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--lav:#8e7cc3;--lavd:#6b58a8;--lavl:#ece6f8;--lavx:#f7f4fc;--ink:#2b2540;--mute:#7a7494;--line:#e4dcf3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.45 "DM Sans",system-ui,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 60px}
h1{font:500 22px "Fraunces",Georgia,serif;margin:0 0 14px;color:var(--lavd)}
.tabs{display:flex;background:var(--lavl);border-radius:999px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:999px;font:600 14px inherit;font-family:inherit;color:var(--lavd);cursor:pointer}
.tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(107,88,168,.2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lavd);outline-offset:2px}
.hide{display:none!important}
.hero{position:relative;border-radius:28px;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;background:linear-gradient(160deg,#b7a6e8,#8e7cc3 60%,#7a68b5) center/cover;overflow:hidden;padding:24px}
.hero.img::before{content:"";position:absolute;inset:0;background:rgba(60,40,110,.42)}
.hero>*{position:relative}
#clock{font:300 clamp(52px,16vw,84px)/1 "Fraunces",Georgia,serif;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(60,40,120,.35)}
#state{font-size:14px;opacity:.92;text-shadow:0 1px 8px rgba(60,40,120,.4)}
.pill{border:0;border-radius:999px;padding:13px 30px;font:600 16px "DM Sans",sans-serif;cursor:pointer;background:#fff;color:var(--lavd);box-shadow:0 6px 18px rgba(60,40,120,.25)}
.ghost{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.6);padding:9px 20px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bgctl{position:absolute;left:14px;bottom:10px;font-size:12px;color:#fff;opacity:.85}
.bgctl button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font:inherit;padding:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--lavx);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.tile b{display:block;font:500 24px "Fraunces",Georgia,serif;color:var(--lavd)}
.tile span{font-size:13px;color:var(--mute)}
.banner{background:var(--lavl);border-radius:18px;padding:12px 14px;margin:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner small{display:block;color:var(--mute)}
.btn{border:0;border-radius:12px;padding:9px 14px;font:600 14px "DM Sans",sans-serif;cursor:pointer;background:var(--lav);color:#fff}
.btn.alt{background:#fff;color:var(--lavd);border:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;gap:8px}
.head h2{font:500 18px "Fraunces",Georgia,serif;margin:0}
.date{font-weight:600;color:var(--lavd);margin:16px 0 6px;font-size:14px}
.entry{border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.entry p{margin:2px 0 0;color:var(--mute);font-size:13px}
.entry .r{text-align:right;white-space:nowrap}
.entry .r b{color:var(--lavd)}
.x{background:none;border:0;color:var(--mute);font-size:12px;cursor:pointer;padding:2px 0}
.x.arm{color:#b3261e;font-weight:600}
.empty{color:var(--mute);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1.05;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-family:inherit;color:var(--ink);padding:0}
.day b{font-size:13px;font-weight:500}
.day span{font-size:10px;min-height:12px;font-weight:600}
.day.on{background:rgba(142,124,195,var(--a));border-color:transparent}
.day.hot{color:#fff}
.day.today{box-shadow:0 0 0 2px var(--lavd)}
.day.sel{outline:2px solid var(--ink);outline-offset:1px}
.mbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;cursor:pointer;color:var(--lavd);font-size:16px}
#modal{position:fixed;inset:0;background:rgba(43,37,64,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:500 20px "Fraunces",Georgia,serif;margin:0 0 4px;color:var(--lavd)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--lavx)}
textarea{resize:none;height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8e7cc3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Punch">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

</head>
<body>
<div class="wrap">
  <h1>Study Punch</h1>
  <div class="tabs" role="tablist">
    <button class="on" data-t="timer" onclick="tab('timer')">Timer</button>
    <button data-t="log" onclick="tab('log')">Log</button>
    <button data-t="cal" onclick="tab('cal')">Calendar</button>
  </div>

  <section id="p-timer">
    <div class="hero" id="hero">
      <div id="clock">00:00:00</div>
      <div id="state"></div>
      <div class="row">
        <button class="pill" id="btnIn" onclick="punchIn()">Punch in</button>
        <button class="pill" id="btnOut" onclick="punchOut()">Punch out</button>
        <button class="pill ghost" id="btnCancel" onclick="cancelRun()">Cancel</button>
      </div>
      <div class="bgctl"><button onclick="$('#file').click()">Change image</button><button id="bgReset" onclick="resetBg()">Reset</button></div>
      <input type="file" id="file" accept="image/*" class="hide" onchange="setBg(this)">
    </div>
    <div class="tiles">
      <div class="tile"><b id="tToday">0m</b><span>Studied today</span></div>
      <div class="tile"><b id="tStreak">0 days</b><span>Current streak</span></div>
    </div>
    <div id="draft"></div>
    <div class="row"><button class="btn alt" onclick="openModal({mode:'manual'})">+ Log a past session</button></div>
  </section>

  <section id="p-log" class="hide">
    <div class="head"><h2>All sessions</h2><button class="btn alt" onclick="openModal({mode:'manual'})">+ Manual log</button></div>
    <div id="logList"></div>
  </section>

  <section id="p-cal" class="hide">
    <div class="tiles">
      <div class="tile"><b id="cStreak">0 days</b><span>Current streak</span></div>
      <div class="tile"><b id="cBest">0 days</b><span>Best streak</span></div>
    </div>
    <div class="head">
      <button class="mbtn" aria-label="Previous month" onclick="shift(-1)">‹</button>
      <h2 id="calTitle"></h2>
      <button class="mbtn" aria-label="Next month" onclick="shift(1)">›</button>
    </div>
    <div class="grid" id="calGrid"></div>
    <div class="head" style="margin-top:16px"><h2 id="selTitle"></h2><span id="monthTot" style="color:var(--mute);font-size:13px"></span></div>
    <div id="selList"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="btnReport" onclick="weekly()">Download weekly report</button></div>
  </section>
</div>

<div id="modal" class="hide" onclick="if(event.target===this)closeModal()">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="mTitle">Save session</h3>
    <div id="mDur" style="color:var(--mute)"></div>
    <div id="mManual" class="hide">
      <label for="fDate">Date</label><input type="date" id="fDate">
      <div class="two"><div><label for="fS">Started at</label><input type="time" id="fS"></div>
      <div><label for="fE">Ended at</label><input type="time" id="fE"></div></div>
    </div>
    <label for="fTitle">Title</label><input id="fTitle" maxlength="80" placeholder="e.g. Companies Act, Ch. 3">
    <label for="fDesc">Short description</label><textarea id="fDesc" maxlength="240" placeholder="What did you cover?"></textarea>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn alt" onclick="closeModal()">Not now</button>
      <button class="btn" onclick="saveModal()">Save session</button>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){return false}return true}};

const dur=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':(m?m+'m':'<1m')};
const short=s=>s>=3600?(Math.round(s/360)/10)+'h':Math.max(1,Math.round(s/60))+'m';

let sessions=LS.get('sp_sessions',[]), active=LS.get('sp_active',null), draft=LS.get('sp_draft',null), bg=LS.get('sp_bg',null)||DEFAULT_BG, custom=LS.get('sp_bg',null);
let cal=new Date(); cal.setDate(1); let sel=key(new Date()), modal=null, arm=null, dl=null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function tab(n){for(const t of ['timer','log','cal'])$('#p-'+t).classList.toggle('hide',t!==n);document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));renderAll()}

function totals(){const t={};for(const s of sessions){const k=key(new Date(s.start));t[k]=(t[k]||0)+s.secs}return t}
function streaks(){const t=totals();let cur=0;const d=new Date();d.setHours(0,0,0,0);if(!t[key(d)])d.setDate(d.getDate()-1);while(t[key(d)]){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;for(const k of Object.keys(t).sort()){const dt=new Date(k+'T00:00:00');run=prev&&Math.round((dt-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=dt}return{cur,best}}
const dayWord=n=>n+(n===1?' day':' days');

/* timer */
function punchIn(){if(active)return;active={start:Date.now()};LS.set('sp_active',active);renderAll();toast('Punched in. Good luck!')}
function stopRun(){const end=Date.now();draft={start:active.start,end};active=null;LS.set('sp_active',null);LS.set('sp_draft',draft);return draft}
function punchOut(){if(!active)return;const d=stopRun();openModal({mode:'save',start:d.start,end:d.end})}
function cancelRun(){if(!active)return;stopRun();renderAll();toast('Moved to draft. You can still save it.')}
function tick(){$('#clock').textContent=hms(active?(Date.now()-active.start)/1000:0)}
function renderTimer(){
  const run=!!active;
  $('#btnIn').classList.toggle('hide',run);$('#btnOut').classList.toggle('hide',!run);$('#btnCancel').classList.toggle('hide',!run);
  $('#state').textContent=run?'Studying since '+tm(active.start):'Ready when you are';
  const h=$('#hero');h.classList.toggle('img',!!bg);h.style.backgroundImage=bg?'url("'+bg+'")':'';
  $('#bgReset').classList.toggle('hide',!custom);
  const t=totals();$('#tToday').textContent=dur(t[key(new Date())]||0);$('#tStreak').textContent=dayWord(streaks().cur);
  const d=$('#draft');
  d.innerHTML=draft?'<div class="banner"><div><b>Draft session</b><small>'+dur((draft.end-draft.start)/1000)+' · '+dl8(key(new Date(draft.start)))+', '+tm(draft.start)+' – '+tm(draft.end)+'</small></div><div class="row"><button class="btn" onclick="openModal({mode:\'save\',start:draft.start,end:draft.end})">Save it</button><button class="btn alt" onclick="dropDraft()">Discard</button></div></div>':'';
  tick();
}
function dropDraft(){draft=null;LS.set('sp_draft',null);renderAll();toast('Draft discarded')}

/* background image */
function setBg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);custom=bg=c.toDataURL('image/jpeg',.82);if(!LS.set('sp_bg',custom))toast('Image applied for now, but too large to remember');renderTimer()};im.src=r.result};r.readAsDataURL(f);inp.value=''}
function resetBg(){custom=null;bg=DEFAULT_BG;LS.set('sp_bg',null);renderTimer()}

/* modal */
function openModal(m){modal=m;const man=m.mode==='manual';
  $('#mTitle').textContent=man?'Log a past session':'Save session';
  $('#mManual').classList.toggle('hide',!man);$('#mDur').classList.toggle('hide',man);
  if(!man)$('#mDur').textContent=tm(m.start)+' – '+tm(m.end)+' · '+dur((m.end-m.start)/1000);
  else{$('#fDate').value=key(new Date());$('#fS').value='';$('#fE').value=''}
  $('#fTitle').value='';$('#fDesc').value='';$('#modal').classList.remove('hide');renderAll();$('#fTitle').focus()}
function closeModal(){$('#modal').classList.add('hide');modal=null;renderAll()}
function saveModal(){
  const title=$('#fTitle').value.trim()||'Study session',desc=$('#fDesc').value.trim();let s;
  if(modal.mode==='manual'){
    const ds=$('#fDate').value,a=$('#fS').value,b=$('#fE').value;
    if(!ds||!a||!b)return toast('Add the date, start time and end time');
    const st=new Date(ds+'T'+a+':00'),en=new Date(ds+'T'+b+':00');if(en<=st)en.setDate(en.getDate()+1);
    s={id:uid(),title,desc,start:st.getTime(),end:en.getTime(),secs:Math.round((en-st)/1000),manual:true};
  }else{
    s={id:uid(),title,desc,start:modal.start,end:modal.end,secs:Math.max(1,Math.round((modal.end-modal.start)/1000))};
    draft=null;LS.set('sp_draft',null);
  }
  sessions.push(s);LS.set('sp_sessions',sessions);closeModal();toast('Session saved');
}

/* log */
const span=s=>tm(s.start)+' – '+tm(s.end)+(key(new Date(s.end))!==key(new Date(s.start))?' (next day)':'');
function entry(s){const a=arm===s.id;return '<div class="entry"><div><b>'+esc(s.title)+'</b>'+(s.desc?'<p>'+esc(s.desc)+'</p>':'')+'</div><div class="r"><b>'+dur(s.secs)+'</b><p>'+(s.end?span(s)+(s.manual?' · manual':''):'Manual entry')+'</p><button class="x'+(a?' arm':'')+'" onclick="del(\''+s.id+'\')">'+(a?'Tap again to delete':'Delete')+'</button></div></div>'}
function del(id){if(arm!==id){arm=id;renderAll();setTimeout(()=>{if(arm===id){arm=null;renderAll()}},3000);return}
  sessions=sessions.filter(s=>s.id!==id);arm=null;LS.set('sp_sessions',sessions);renderAll();toast('Session deleted')}
function renderLog(){
  if(!sessions.length){$('#logList').innerHTML='<div class="empty">No sessions yet. Punch in to start, or add a past one with Manual log.</div>';return}
  const by={};for(const s of sessions){(by[key(new Date(s.start))]??=[]).push(s)}
  $('#logList').innerHTML=Object.keys(by).sort().reverse().map(k=>{const a=by[k].sort((x,y)=>y.start-x.start);const tot=a.reduce((n,s)=>n+s.secs,0);
    return '<div class="date">'+dl8(k)+' · '+dur(tot)+'</div>'+a.map(entry).join('')}).join('');
}

/* calendar */
function shift(n){cal.setMonth(cal.getMonth()+n);renderCal()}
function pick(k){sel=k;renderCal()}
function renderCal(){
  const t=totals(),st=streaks(),y=cal.getFullYear(),m=cal.getMonth();
  $('#cStreak').textContent=dayWord(st.cur);$('#cBest').textContent=dayWord(st.best);
  $('#calTitle').textContent=cal.toLocaleString('en',{month:'long',year:'numeric'});
  const lead=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),today=key(new Date());
  let h=['M','T','W','T','F','S','S'].map(d=>'<div class="dow">'+d+'</div>').join('')+'<div></div>'.repeat(lead),mt=0;
  for(let d=1;d<=days;d++){const k=key(new Date(y,m,d)),s=t[k]||0;mt+=s;const f=Math.min(1,s/14400),a=(.2+.8*f).toFixed(2);
    h+='<button class="day'+(s?' on':'')+(f>.45?' hot':'')+(k===today?' today':'')+(k===sel?' sel':'')+'" style="--a:'+a+'" onclick="pick(\''+k+'\')" aria-label="'+dl8(k)+(s?', '+dur(s):'')+'"><b>'+d+'</b><span>'+(s?short(s):'')+'</span></button>'}
  $('#calGrid').innerHTML=h;$('#monthTot').textContent='Month total: '+dur(mt);
  const L=sessions.filter(s=>key(new Date(s.start))===sel).sort((a,b)=>b.start-a.start);
  $('#selTitle').textContent=dl8(sel)+(t[sel]?' · '+dur(t[sel]):'');
  $('#selList').innerHTML=L.length?L.map(entry).join(''):'<div class="empty">Nothing logged on this day.</div>';
  $('#btnReport').classList.toggle('hide',!dl);
}

/* weekly report (PNG) */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function weekly(){
  if(!dl)return toast('Download isn’t available here');
  try{await document.fonts.load('300 100px Fraunces')}catch(e){}
  const t=totals(),mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const ds=[];let tot=0,dd=0;
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const s=t[key(d)]||0;ds.push(s);tot+=s;if(s)dd++}
  const cnt=sessions.filter(s=>{const k=key(new Date(s.start));return k>=key(mon)&&k<=key(sun)}).length;
  const W=1080,H=1350,c=Object.assign(document.createElement('canvas'),{width:W,height:H}),x=c.getContext('2d');
  const serif='Fraunces, Georgia, serif',sans='"DM Sans", Arial, sans-serif';
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#c4b6ee');g.addColorStop(1,'#7a68b5');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';rr(x,60,60,960,1230,48);x.fill();x.textAlign='center';
  x.fillStyle='#6b58a8';x.font='500 54px '+serif;x.fillText('Weekly study report',540,170);
  x.fillStyle='#7a7494';x.font='400 30px '+sans;
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});x.fillText(f(mon)+' – '+f(sun)+' '+sun.getFullYear(),540,222);
  x.fillStyle='#6b58a8';x.font='300 150px '+serif;x.fillText(dur(tot).replace('<1m','0m'),540,430);
  x.fillStyle='#7a7494';x.font='400 30px '+sans;x.fillText('studied this week',540,480);
  const mx=Math.max(3600,...ds),base=900,ch=300,bw=90,gap=(960-120-bw*7)/6;
  ds.forEach((s,i)=>{const bx=120+i*(bw+gap),bh=s?Math.max(14,ch*s/mx):6;x.fillStyle=s?'#8e7cc3':'#ece6f8';rr(x,bx,base-bh,bw,bh,14);x.fill();
    x.fillStyle='#2b2540';x.font='600 24px '+sans;if(s)x.fillText(short(s),bx+bw/2,base-bh-12);
    x.fillStyle='#7a7494';x.font='500 26px '+sans;x.fillText('MTWTFSS'[i],bx+bw/2,base+44)});
  const st=streaks(),stats=[[dd+'/7','days studied'],[String(cnt),'sessions'],[String(st.cur),'day streak']];
  stats.forEach((v,i)=>{const cx=240+i*300;x.fillStyle='#f7f4fc';rr(x,cx-120,1010,240,130,28);x.fill();x.fillStyle='#6b58a8';x.font='500 52px '+serif;x.fillText(v[0],cx,1075);x.fillStyle='#7a7494';x.font='400 24px '+sans;x.fillText(v[1],cx,1115)});
  const hrs=tot/3600,line=hrs===0?'A fresh week starts with one punch in.':hrs<5?'Small sessions add up. Keep showing up.':hrs<15?'Solid week. Your future self is taking notes.':'Unstoppable. This is how ranks get earned.';
  x.fillStyle='#6b58a8';x.font='italic 400 34px '+serif;x.fillText(line,540,1230);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  try{await dl.save({filename:'study-report-'+key(mon)+'.png',data:blob})}catch(e){if(e&&e.code!=='declined')toast('Couldn’t save the report')}
}

function renderAll(){renderTimer();renderLog();renderCal()}
renderAll();setInterval(tick,500);
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{dl=d;renderCal()}).catch(()=>{})}
</script>
